# Run the benchmark on a GitHub-hosted runner and publish the report:
#
#   - the run's job summary
#   - a `bench-results` artifact (report.md, results.json, plans/)
#   - the `bench-results` branch: README.md is the latest report, runs/<timestamp>/ keeps every run
#     (default branch, full runs only)
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Data volume multiplier (1 = ~3.2M rows)
        default: "1"
      runs:
        description: Timed runs per query and scenario
        default: "5"
      only:
        description: Only run queries whose file name contains this (partial runs are not published to the branch)
        default: ""
  push:
    branches: [main, master]
    paths:
      - bench/**
      - sql/**
      - nix/**
      - flake.nix
      - flake.lock
      - .github/workflows/bench.yml

# One benchmark at a time: they push to the same branch
concurrency:
  group: bench

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BOOKSTORE_SCALE: ${{ inputs.scale || '1' }}
      RUNS: ${{ inputs.runs || '5' }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # MySQL and PostgreSQL come from cache.nixos.org, only mysql_fdw is built
      - name: Build
        run: |
          nix build .#bookstore --print-build-logs
          echo "$PWD/result/bin" >> "$GITHUB_PATH"

      - name: Start and seed MySQL + PostgreSQL
        run: bookstore up

      - name: Run benchmark
        run: |
          out="$RUNNER_TEMP/bench"
          args=(--runs "$RUNS" --out "$out")
          if [[ -n "$ONLY" ]]; then args+=(--only "$ONLY"); fi
          bookstore bench "${args[@]}"

          # Say where the numbers come from at the top of the report
          server="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "> [Workflow run #$GITHUB_RUN_NUMBER]($server/actions/runs/$GITHUB_RUN_ID)" \
              "on commit [\`${GITHUB_SHA::7}\`]($server/commit/$GITHUB_SHA) (\`$GITHUB_REF_NAME\`)," \
              "GitHub-hosted runner. Shared VMs are noisy and differ from the machine behind the" \
              "README's numbers: compare ratios, not absolute times."
            echo
            cat "$out/report.md"
          } > "$RUNNER_TEMP/report.md"
          mv "$RUNNER_TEMP/report.md" "$out/report.md"

      - name: Server logs
        if: failure()
        run: tail -n 100 .data/mysql/mysqld.err .data/pg/postgres.log || true

      - name: Upload results
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench

      - name: Publish to the bench-results branch
        id: publish
        if: github.ref_name == github.event.repository.default_branch && env.ONLY == ''
        run: |
          run_dir="runs/$(date -u +%Y%m%d-%H%M%S)"
          out="$RUNNER_TEMP/bench"
          publish="$RUNNER_TEMP/publish"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin bench-results; then
            git worktree add -B bench-results "$publish" FETCH_HEAD
          else
            git worktree add --orphan -b bench-results "$publish"
          fi
          cd "$publish"

          # Latest run at the root, so the branch page renders its report
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name runs -exec rm -rf {} +
          mkdir -p "$run_dir"
          cp -r "$out/." "$run_dir/"
          cp -r "$out/plans" "$out/results.json" .
          {
            cat "$out/report.md"
            echo
            echo "Previous runs: [runs/](runs/)"
          } > README.md

          git add -A
          git commit --quiet -m "bench: $run_dir, $GITHUB_REF_NAME@${GITHUB_SHA::7} (scale $BOOKSTORE_SCALE)"
          git push origin bench-results
          echo "run_dir=$run_dir" >> "$GITHUB_OUTPUT"

      - name: Job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_DIR: ${{ steps.publish.outputs.run_dir }}
        run: |
          report="$RUNNER_TEMP/bench/report.md"
          {
            if [[ -n "$RUN_DIR" ]]; then
              server="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
              echo "Published to [\`bench-results/$RUN_DIR\`]($server/tree/bench-results/$RUN_DIR)." \
                "Full results (plans, results.json): [artifact]($ARTIFACT_URL)."
              echo
              # Plan links are relative to the report: point them at the published copy
              sed "s#](plans/#]($server/blob/bench-results/$RUN_DIR/plans/#g" "$report"
            else
              echo "Full results (plans, results.json): [artifact]($ARTIFACT_URL)."
              echo
              # Unpublished: the plans only exist in the artifact, drop the links
              sed -E 's#\[([^]]*)\]\(plans/[^)]*\)#\1#g' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
